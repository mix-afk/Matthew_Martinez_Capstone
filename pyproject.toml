[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys"
version = "1.0.0"
description = "Two-stage product recommender on H&M e-commerce data (capstone project)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Matthew Martinez" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recsys = ["static/*.html"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
